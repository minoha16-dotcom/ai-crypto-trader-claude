name: Vike V3.1 Triple Barrier Label Engine

on:
  push:
    branches: [feat/vike-v31-triple-barrier-label-engine]
    paths:
      - "backend/triple_barrier_labels.py"
      - "backend/causal_market_features.py"
      - "backend/binance_usdm_liquidation.py"
      - "backend/binance_usdm_cross_hedge_liquidation.py"
      - "scripts/audit_binance_usdm_mark_price.py"
      - "tests/test_causal_market_features.py"
      - "tests/test_binance_usdm_liquidation.py"
      - "tests/test_binance_usdm_cross_hedge_liquidation.py"
      - "tests/test_audit_binance_usdm_mark_price.py"
      - "tests/test_triple_barrier_labels.py"
      - "docs/vike-v31-triple-barrier-labels.md"
      - ".github/workflows/vike-v31-label-engine.yml"
  pull_request:
    branches: [feat/vike-hyperliquid-historical-cohort, main]
    paths:
      - "backend/triple_barrier_labels.py"
      - "backend/binance_usdm_liquidation.py"
      - "backend/binance_usdm_cross_hedge_liquidation.py"
      - "tests/test_triple_barrier_labels.py"
      - "tests/test_binance_usdm_cross_hedge_liquidation.py"
      - "docs/vike-v31-triple-barrier-labels.md"
      - ".github/workflows/vike-v31-label-engine.yml"

permissions:
  contents: read

jobs:
  label-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile label engine
        run: python -m py_compile backend/triple_barrier_labels.py backend/causal_market_features.py backend/binance_usdm_liquidation.py backend/binance_usdm_cross_hedge_liquidation.py scripts/audit_binance_usdm_mark_price.py
      - name: Run label engine tests
        run: python -m pytest -q tests/test_causal_market_features.py tests/test_binance_usdm_liquidation.py tests/test_binance_usdm_cross_hedge_liquidation.py tests/test_audit_binance_usdm_mark_price.py tests/test_triple_barrier_labels.py
