name: Vike V3.1 Coverage Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run historical timestamp validator tests
        run: python -m pytest -q tests/test_historical_data_validation.py
      - name: Probe public Binance USD-M data boundaries
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/binance_usdm_coverage_probe.py \
            --out artifacts/binance-usdm-coverage.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vike-v31-binance-coverage-${{ github.run_number }}
          path: artifacts/binance-usdm-coverage.json
          if-no-files-found: warn
          retention-days: 7
