name: Hyperliquid historical Advisor training

on:
  workflow_dispatch:
    inputs:
      start:
        description: Observation start (UTC, inclusive)
        required: true
        default: "2026-10-16T00:00:00Z"
        type: string
      end:
        description: Observation end (UTC, exclusive)
        required: true
        default: "2026-11-16T00:00:00Z"
        type: string
      cohort_label:
        description: Historical point-in-time Vike PnL cohort
        required: true
        default: "3x_smart"
        type: choice
        options:
          - "3x_smart"
          - "2x_smart"
          - "smart"
      wallet_limit:
        description: Maximum wallets sampled from the cohort
        required: true
        default: "1000"
        type: string
      history_warmup_days:
        description: Pre-window days used only to reconstruct open positions
        required: true
        default: "17"
        type: string

permissions:
  contents: read

concurrency:
  group: hyperliquid-historical-advisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-prepare-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Freeze the historical point-in-time cohort
        env:
          VIKE_API_KEY: ${{ secrets.VIKE_API_KEY }}
          START_UTC: ${{ inputs.start }}
          END_UTC: ${{ inputs.end }}
          COHORT_LABEL: ${{ inputs.cohort_label }}
          WALLET_LIMIT: ${{ inputs.wallet_limit }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CODE_SHA="$(git rev-parse HEAD)"
          echo "CODE_SHA=$CODE_SHA" >> "$GITHUB_ENV"
          python scripts/fetch_vike_hyperliquid_dataset.py \
            --snapshot-only \
            --start "$START_UTC" \
            --end "$END_UTC" \
            --cohort-label "$COHORT_LABEL" \
            --wallet-limit "$WALLET_LIMIT" \
            --collector-code-sha "$CODE_SHA" \
            --out artifacts/vike-cohort-snapshot.json

      - name: Collect historical fills and accounting evidence
        env:
          VIKE_API_KEY: ${{ secrets.VIKE_API_KEY }}
          START_UTC: ${{ inputs.start }}
          END_UTC: ${{ inputs.end }}
          HISTORY_WARMUP_DAYS: ${{ inputs.history_warmup_days }}
        run: |
          set -euo pipefail
          python scripts/fetch_vike_hyperliquid_dataset.py \
            --snapshot-file artifacts/vike-cohort-snapshot.json \
            --start "$START_UTC" \
            --end "$END_UTC" \
            --history-warmup-days "$HISTORY_WARMUP_DAYS" \
            --collector-code-sha "$CODE_SHA" \
            --state-dir "$RUNNER_TEMP/vike-checkpoints" \
            --out artifacts/hyperliquid-vike-raw-dataset.json

      - name: Verify complete collection before training
        env:
          CODE_SHA: ${{ env.CODE_SHA }}
          START_UTC: ${{ inputs.start }}
          END_UTC: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import date, timedelta
          from pathlib import Path

          root = Path("artifacts")
          assert os.environ["START_UTC"] == "2026-10-16T00:00:00Z", "the approval run requires the full study start"
          assert os.environ["END_UTC"] == "2026-11-16T00:00:00Z", "the approval run requires the full study end"
          marker = json.loads((root / "vike-collection-complete.json").read_text())
          dataset = root / "hyperliquid-vike-raw-dataset.json"
          expected_sha = hashlib.sha256(dataset.read_bytes()).hexdigest()
          assert marker.get("complete") is True, "collector completion marker is absent"
          assert marker.get("data_start_utc") == os.environ["START_UTC"]
          assert marker.get("data_end_utc") == os.environ["END_UTC"]
          assert marker.get("collector_code_sha") == os.environ["CODE_SHA"]
          assert marker.get("dataset_sha256") == expected_sha, "dataset hash differs from completion marker"
          manifest = json.loads(dataset.read_text())["manifest"]
          assert manifest.get("data_start_utc", "").replace("Z", "+00:00").startswith(os.environ["START_UTC"].replace("Z", "+00:00"))
          assert manifest.get("data_end_utc", "").replace("Z", "+00:00").startswith(os.environ["END_UTC"].replace("Z", "+00:00"))
          expected = []
          day = date(2026, 9, 29)
          while day < date(2026, 11, 16):
              expected.append(day.isoformat())
              day += timedelta(days=1)
          observed = marker.get("archive_days", [])
          assert [row["date"] for row in observed] == expected, "one or more warm-up/observation archive days are missing"
          assert all(len(row.get("sha256", "")) == 64 for row in observed), "an archive hash is missing"
          print(f"VERIFIED_COLLECTION_DAYS {len(observed)}")
          print(f"VERIFIED_OBSERVATION_WINDOW {marker['data_start_utc']} .. {marker['data_end_utc']}")
          PY

      - name: Prepare independent symbol and timeframe datasets
        run: |
          set -euo pipefail
          python scripts/prepare_hyperliquid_advisor_dataset.py \
            --raw-dataset artifacts/hyperliquid-vike-raw-dataset.json \
            --out artifacts/advisor-training-dataset.json \
            --code-sha "$CODE_SHA" \
            --timeframes 1h,4h

      - name: Train and validate each independent group
        id: train
        run: |
          set +e
          python scripts/train_advisor_model.py \
            --dataset artifacts/advisor-training-dataset.json \
            --out-dir artifacts/advisor-models \
            --code-sha "$CODE_SHA"
          status=$?
          echo "training_exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            echo "::warning::The pipeline ran, but no independent market group passed every approval gate."
            exit 0
          fi
          exit "$status"

      - name: Summarize approval report without exposing wallet-level data
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/advisor-models/advisor-model-approval.json")
          if not report_path.exists():
              print("No approval report was generated.")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"groups_requested={report.get('groups_requested', 0)}")
          print(f"groups_approved={report.get('groups_approved', 0)}")
          print(f"groups_disabled={report.get('groups_disabled', 0)}")
          for row in report.get("groups", []):
              approval = row.get("approval") or {}
              key = row.get("group") or {}
              label = "/".join(str(key.get(k) or "") for k in (
                  "exchange", "symbol", "market_type", "timeframe"
              ))
              reasons = ",".join(
                  str(item.get("code") or "") for item in approval.get("rejection_reasons", [])
              ) or "none"
              print(f"{label}: {approval.get('model_status', 'UNKNOWN')} ({reasons})")
          PY

      - name: Remove raw licensed data before artifact upload
        if: always()
        run: |
          rm -f artifacts/vike-cohort-snapshot.json
          rm -f artifacts/hyperliquid-vike-raw-dataset.json
          rm -f artifacts/advisor-training-dataset.json
          rm -rf "$RUNNER_TEMP/vike-checkpoints"

      - name: Upload approval report and research-only model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-advisor-approval-${{ github.run_number }}
          path: |
            artifacts/advisor-models/advisor-model-approval.json
            artifacts/advisor-models/advisor-model-*.json
          if-no-files-found: warn
          retention-days: 14

