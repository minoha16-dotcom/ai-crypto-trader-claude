name: Strategy validation research report

on:
  pull_request:
    branches: [feature/p1-futures-margin-funding-advisor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STRATEGY_VALIDATION_EXCHANGES: kucoin,okx
      STRATEGY_VALIDATION_LIMIT: "1800"
      STRATEGY_VALIDATION_OUT_DIR: artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run fixed-strategy walk-forward, threshold and feature-ablation experiments
        run: python scripts/run_strategy_validation.py
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-validation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
