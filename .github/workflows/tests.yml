name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify project package import
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import backend; from backend.indicators import ema, rsi, atr, analyze; print('backend package import: OK')"
      - name: Run test suite
        env:
          DATABASE_URL: sqlite:///./test-data/trader.db
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
