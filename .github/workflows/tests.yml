name: Tests

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run test suite
        env:
          DATABASE_URL: sqlite:///./test-data/trader.db
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trader_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run PostgreSQL migration and paper-trading integration tests
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/trader_test
        run: python -m pytest -q tests/test_postgres_integration.py

  vike-historical-training:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-vike-historical-training' &&
      github.event.pull_request.head.ref == 'feat/vike-hyperliquid-historical-cohort'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the Vike collector branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Freeze historical point-in-time cohort
        env:
          VIKE_API_KEY: ${{ secrets.VIKE_API_KEY }}
          START_UTC: "2026-10-16T00:00:00Z"
          END_UTC: "2026-11-16T00:00:00Z"
          COHORT_LABEL: "3x_smart"
          WALLET_LIMIT: "200"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CODE_SHA="$(git rev-parse HEAD)"
          echo "CODE_SHA=$CODE_SHA" >> "$GITHUB_ENV"
          python scripts/fetch_vike_hyperliquid_dataset.py \
            --snapshot-only \
            --start "$START_UTC" \
            --end "$END_UTC" \
            --cohort-label "$COHORT_LABEL" \
            --wallet-limit "$WALLET_LIMIT" \
            --collector-code-sha "$CODE_SHA" \
            --out artifacts/vike-cohort-snapshot.json

      - name: Collect historical fills and accounting evidence
        env:
          VIKE_API_KEY: ${{ secrets.VIKE_API_KEY }}
          START_UTC: "2026-10-16T00:00:00Z"
          END_UTC: "2026-11-16T00:00:00Z"
          HISTORY_WARMUP_DAYS: "17"
        run: |
          set -euo pipefail
          python scripts/fetch_vike_hyperliquid_dataset.py \
            --snapshot-file artifacts/vike-cohort-snapshot.json \
            --start "$START_UTC" \
            --end "$END_UTC" \
            --history-warmup-days "$HISTORY_WARMUP_DAYS" \
            --collector-code-sha "$CODE_SHA" \
            --out artifacts/hyperliquid-vike-raw-dataset.json

      - name: Prepare independent symbol and timeframe datasets
        run: |
          set -euo pipefail
          python scripts/prepare_hyperliquid_advisor_dataset.py \
            --raw-dataset artifacts/hyperliquid-vike-raw-dataset.json \
            --out artifacts/advisor-training-dataset.json \
            --code-sha "$CODE_SHA" \
            --timeframes 1h,4h

      - name: Train and validate every independent group
        run: |
          set +e
          python scripts/train_advisor_model.py \
            --dataset artifacts/advisor-training-dataset.json \
            --out-dir artifacts/advisor-models \
            --code-sha "$CODE_SHA"
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::No independent market group passed all model approval gates."
            exit 0
          fi
          exit "$status"

      - name: Summarize approval report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/advisor-models/advisor-model-approval.json")
          if not report_path.exists():
              print("No approval report was generated.")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"groups_requested={report.get('groups_requested', 0)}")
          print(f"groups_approved={report.get('groups_approved', 0)}")
          print(f"groups_disabled={report.get('groups_disabled', 0)}")
          for row in report.get("groups", []):
              approval = row.get("approval") or {}
              key = row.get("group") or {}
              label = "/".join(str(key.get(k) or "") for k in (
                  "exchange", "symbol", "market_type", "timeframe"
              ))
              reasons = ",".join(
                  str(item.get("code") or "") for item in approval.get("rejection_reasons", [])
              ) or "none"
              print(f"{label}: {approval.get('model_status', 'UNKNOWN')} ({reasons})")
          PY

      - name: Remove licensed raw data before artifact upload
        if: always()
        run: |
          rm -f artifacts/vike-cohort-snapshot.json
          rm -f artifacts/hyperliquid-vike-raw-dataset.json
          rm -f artifacts/advisor-training-dataset.json

      - name: Upload approval report and research-only model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-advisor-approval-${{ github.run_number }}
          path: |
            artifacts/advisor-models/advisor-model-approval.json
            artifacts/advisor-models/advisor-model-*.json
          if-no-files-found: warn
          retention-days: 14
