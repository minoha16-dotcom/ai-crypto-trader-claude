name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run test suite
        env:
          DATABASE_URL: sqlite:///./test-data/trader.db
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trader_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run PostgreSQL migration and paper-trading integration tests
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/trader_test
        run: python -m pytest -q tests/test_postgres_integration.py
