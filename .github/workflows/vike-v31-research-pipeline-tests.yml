name: Vike V3.1 Verified Labels and Walk-Forward Tests

on:
  push:
    branches: [feat/vike-v31-verified-label-walk-forward]
    paths:
      - "scripts/vike_v31_research_pipeline.py"
      - "scripts/vike_v31_funding_archive_audit.py"
      - "scripts/vike_v31_funding_pagination_audit.py"
      - "tests/test_vike_v31_research_pipeline.py"
      - "backend/triple_barrier_labels.py"
      - "backend/causal_market_features.py"
      - "backend/binance_usdm_liquidation.py"
      - "scripts/vike_exploratory_train.py"
      - "requirements-vike-research.txt"
      - ".github/workflows/vike-v31-research-pipeline-tests.yml"
  pull_request:
    branches: [feat/vike-v31-drive-exploratory-training]
    paths:
      - "scripts/vike_v31_research_pipeline.py"
      - "tests/test_vike_v31_research_pipeline.py"
      - "backend/triple_barrier_labels.py"
      - "backend/causal_market_features.py"
      - "backend/binance_usdm_liquidation.py"
      - "scripts/vike_exploratory_train.py"
      - "requirements-vike-research.txt"
      - ".github/workflows/vike-v31-research-pipeline-tests.yml"

permissions:
  contents: read

jobs:
  verified-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-vike-research.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements-vike-research.txt
      - name: Compile research pipeline
        run: |
          python -m py_compile scripts/vike_v31_research_pipeline.py
          python -m py_compile scripts/vike_v31_funding_archive_audit.py
          python -m py_compile scripts/vike_v31_funding_pagination_audit.py
          python -m py_compile backend/triple_barrier_labels.py
      - name: Run Triple-Barrier, data-loader and walk-forward gate tests
        run: |
          python -m pytest -q tests/test_vike_v31_research_pipeline.py
          python -m pytest -q tests/test_triple_barrier_labels.py
          python -m pytest -q tests/test_vike_exploratory_train.py
