name: Hyperliquid Strategy Research

on:
  push:
    branches:
      - feature/scan-data-validation-v1
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Hyperliquid perp symbols"
        required: true
        default: "BTC,ETH,SOL,HYPE"
        type: string
      timeframes:
        description: "Comma-separated timeframes"
        required: true
        default: "15m,4h"
        type: string

permissions:
  contents: read

concurrency:
  group: hyperliquid-strategy-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIKE_API_KEY: ${{ secrets.VIKE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate Vike secret is configured
        shell: bash
        run: |
          if [ -z "${VIKE_API_KEY}" ]; then
            echo "::error::Repository secret VIKE_API_KEY is missing or empty."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-research.txt
          python -m pip install pytest

      - name: Run strategy and backtest regression tests
        run: |
          python -m pytest -q tests/test_backtest.py tests/test_walk_forward.py tests/test_strategy_research.py tests/test_signal_gate_diagnostics.py

      - name: Collect Hyperliquid OHLCV and run per-group Walk-Forward
        env:
          RESEARCH_SYMBOLS: ${{ inputs.symbols }}
          RESEARCH_TIMEFRAMES: ${{ inputs.timeframes }}
        run: |
          python scripts/run_hyperliquid_strategy_research.py \
            --start "2026-10-18T00:00:00Z" \
            --end "2026-11-17T00:00:00Z" \
            --symbols "${RESEARCH_SYMBOLS}" \
            --timeframes "${RESEARCH_TIMEFRAMES}" \
            --test-bars 200 \
            --step-bars 200 \
            --max-folds 15

      - name: Upload research reports (no API key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-strategy-research-${{ github.run_id }}
          path: |
            data/strategy-research/hyperliquid/reports.json
            data/strategy-research/hyperliquid/approval-candidate.json
            data/strategy-research/hyperliquid/*.json
          if-no-files-found: warn
          retention-days: 14
