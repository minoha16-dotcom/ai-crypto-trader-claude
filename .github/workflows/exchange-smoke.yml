name: Public exchange connectivity smoke test

on:
  # Public exchanges may rate-limit GitHub-hosted runner IPs.
  # Run this diagnostic manually when verifying venue connectivity.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
      - name: Install CCXT and backend configuration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ccxt>=4.4,<5" "pydantic-settings>=2.6,<3"
      - name: Check public Spot and Futures endpoints for KuCoin, Bybit and OKX
        env:
          BYBIT_API_HOSTNAME: bytick.com
          SMOKE_REQUEST_PAUSE_SECONDS: "15"
        run: python scripts/check_exchanges.py
