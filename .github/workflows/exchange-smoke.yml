name: Public exchange connectivity smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [deploy/render-supabase-postgres]

permissions:
  contents: read

jobs:
  public-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
          cache: pip
      - name: Install CCXT
        run: python -m pip install --upgrade pip "ccxt>=4.4,<5"
      - name: Check public Spot and Futures endpoints for KuCoin, Bybit and OKX
        run: python scripts/check_exchanges.py
