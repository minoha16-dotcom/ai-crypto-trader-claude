name: Public exchange connectivity smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CCXT
        run: python -m pip install --upgrade pip ccxt
      - name: Check Binance, Bybit and OKX public spot endpoints
        run: python scripts/check_exchanges.py
