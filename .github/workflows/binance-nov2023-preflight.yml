name: Binance BTCUSDT November 2023 Data Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Test Binance preflight helpers
        run: python -m pytest -q tests/test_binance_nov2023_preflight.py

      - name: Download and audit official Binance USD-M archives
        run: |
          set -euo pipefail
          python scripts/binance_nov2023_data_preflight.py --out-dir artifacts/binance-nov2023

      - name: Add audit summary
        if: always()
        run: |
          if [ -f artifacts/binance-nov2023/data-quality-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/binance-nov2023/data-quality-report.json").read_text())
          print("# Binance BTCUSDT November 2023 preflight")
          print()
          print(f"- Klines rows: {((report.get('klines') or {}).get('rows'))}")
          print(f"- Mark Price rows: {(((report.get('mark_price') or {}).get('audit') or {}).get('rows'))}")
          print(f"- Common timestamps: {(report.get('alignment') or {}).get('common_timestamps')}")
          print(f"- Funding status: {(report.get('funding') or {}).get('status')}")
          print(f"- Training gate: {(report.get('training_gate') or {}).get('status')}")
          print()
          print("## Training blockers")
          for reason in (report.get("training_gate") or {}).get("reasons", []):
              print(f"- {reason}")
          PY
          else
            echo "Preflight report was not produced; inspect the download/audit step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload data quality report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-btcusdt-nov2023-preflight
          path: artifacts/binance-nov2023/data-quality-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove downloaded market data from runner workspace
        if: always()
        run: |
          rm -f artifacts/binance-nov2023/*.zip
          rm -f artifacts/binance-nov2023/funding-rates.json
