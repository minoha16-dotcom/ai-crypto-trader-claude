name: Vike V3.1 Resumable Collector Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/binance_usdm_resumable_collector.py"
      - "tests/test_binance_usdm_resumable_collector.py"
      - "tests/test_audit_binance_usdm_funding.py"
      - "tests/test_reconcile_binance_usdm_funding_archive.py"
      - "docs/vike-v31-resumable-collector.md"
      - ".github/workflows/vike-v31-collector.yml"
  push:
    branches: [feat/vike-v31-acceptance-protocol]
    paths:
      - "scripts/binance_usdm_resumable_collector.py"
      - "tests/test_binance_usdm_resumable_collector.py"
      - "docs/vike-v31-resumable-collector.md"
      - ".github/workflows/vike-v31-collector.yml"

permissions:
  contents: read

jobs:
  collector-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests urllib3
      - name: Compile data tools
        run: |
          python -m py_compile scripts/binance_usdm_resumable_collector.py
          python -m py_compile scripts/audit_binance_usdm_funding.py
          python -m py_compile scripts/reconcile_binance_usdm_funding_archive.py
      - name: Run collector and Funding audit tests
        run: python -m pytest -q tests/test_binance_usdm_resumable_collector.py tests/test_audit_binance_usdm_funding.py tests/test_reconcile_binance_usdm_funding_archive.py
