name: Render bounded health probe

on:
  push:
    branches:
      - feature/render-bounded-health-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-bounded-health-probe
  cancel-in-progress: false

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public liveness endpoint with bounded concurrency
        run: python scripts/render_bounded_health_probe.py
