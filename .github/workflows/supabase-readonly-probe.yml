name: Supabase read-only connectivity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4" pytest
      - name: Verify Supabase connectivity and schema without writes
        env:
          TRADER_DATABASE_URL: ${{ secrets.TRADER_DATABASE_URL }}
        run: python -m pytest -q tests/test_supabase_readonly_probe.py
