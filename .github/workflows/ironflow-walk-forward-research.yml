name: Ironflow Hyperliquid Walk-Forward Research

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Hyperliquid perpetual symbols"
        required: true
        default: "BTC,ETH,SOL,HYPE"
        type: string
      timeframes:
        description: "Comma-separated independent timeframes"
        required: true
        default: "1h,4h,1d"
        type: string

permissions:
  contents: read

concurrency:
  group: ironflow-walk-forward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-research.txt
          python -m pip install pytest

      - name: Run collector, strategy and Walk-Forward regression tests
        run: |
          python -m pytest -q tests/test_ironflow_hyperliquid_collector.py tests/test_backtest.py tests/test_walk_forward.py tests/test_strategy_research.py

      - name: Download and validate Ironflow candles
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          python scripts/download_ironflow_hyperliquid_candles.py \
            --symbols "$SYMBOLS" \
            --start-month 2025-05 \
            --end-month 2026-10

      - name: Run independent per-group Walk-Forward research
        env:
          SYMBOLS: ${{ inputs.symbols }}
          TIMEFRAMES: ${{ inputs.timeframes }}
        run: |
          python scripts/run_ironflow_strategy_research.py \
            --symbols "$SYMBOLS" \
            --timeframes "$TIMEFRAMES"

      - name: Upload coverage and research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironflow-walk-forward-research-${{ github.run_id }}
          path: |
            data/ironflow/processed/coverage-report.json
            data/ironflow/processed/*.json
            data/strategy-research/ironflow/*.json
          if-no-files-found: warn
          retention-days: 14
